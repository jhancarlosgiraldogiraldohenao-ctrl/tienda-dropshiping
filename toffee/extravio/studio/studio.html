<title>Claude Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Montserrat:wght@800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: estudio de postproducción — barra superior, visor y Claude arriba, inspector, línea de tiempo multipista abajo. Un solo look oscuro a propósito. */
:root{
  --bg:#0f1013; --panel:#17181d; --panel2:#1e2027; --line:#2a2c35; --fg:#eceef3; --muted:#8d92a3;
  --violet:#8b6cff; --blue:#3d8bff; --voz:#8b6cff; --cama:#2f9e8f; --toma:#3a3f4d; --warn:#ffb547; --bad:#ff5d6c; --ok:#3ccf91;
  --f-ui:"Figtree",system-ui,sans-serif; --f-disp:"Sora","Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);margin:0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0 10px;display:flex;flex-direction:column;overflow:hidden}
button{font:600 13px var(--f-ui);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:34px;padding:0 12px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#3a3d4a}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.pri{background:linear-gradient(135deg,var(--violet),var(--blue));border:0}
button.on{background:#2c2550;border-color:var(--violet)}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:13px var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:10px 8px}
header h1{font:700 17px var(--f-disp);margin:0;letter-spacing:.01em}
header h1 b{background:linear-gradient(135deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.proj{color:var(--muted);font-size:13px}
.save{font:500 12px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.grow{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:10px}
.work{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;flex:none;align-content:start}
@media (max-width:820px),(orientation:portrait){main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}body{overflow:auto}.viewer{height:64vh;justify-self:center}}
.viewer{background:#000;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;height:100%;aspect-ratio:9/16;max-width:62vw;min-height:0;overflow:hidden;position:relative}
.frame{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;container-type:inline-size}
.viewer video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.vbtns{position:absolute;top:8px;right:8px;opacity:.75;display:flex;gap:6px;z-index:2}
.vbtns button{background:#000a;border-color:#fff3;min-height:30px;font-size:12px}
.fsbar{display:none;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);gap:8px;z-index:2;background:#000b;padding:8px;border-radius:12px}
.viewer:fullscreen .fsbar{display:flex}
.viewer:fullscreen{border:0;border-radius:0}

.sub{position:absolute;left:5.5%;right:5.5%;top:62.5%;transform:translateY(-50%);text-align:center;font:800 6.3cqw/1.15 "Montserrat",sans-serif;color:#fff;-webkit-text-stroke:.75cqw #000;paint-order:stroke fill;text-shadow:0 .3cqw .4cqw #00000080;pointer-events:none}
.sub.tit{top:29.2%;font-size:5.4cqw;letter-spacing:.55cqw}
.sub r{color:#ff3d3d}
.claude{position:fixed;top:64px;right:10px;bottom:10px;width:min(380px,92vw);z-index:20;display:none;flex-direction:column;box-shadow:0 10px 40px #000a}
body.conclaude .claude{display:flex}
.side{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.card h2{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.transport{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tc{font:500 15px var(--f-mono);min-width:118px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.insp .big{font:600 15px var(--f-ui);margin-bottom:4px}
.insp .txt{color:var(--muted);font-size:13px;margin-bottom:8px}
.warn{color:var(--warn);font-size:12.5px}
.claude .log{flex:1;min-height:120px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.msg{padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.me{background:#1d2a44;align-self:flex-end;max-width:92%}
.msg.ai{border:1px solid #33295e}
.msg .who{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.status{font:500 12px var(--f-mono);color:var(--violet);min-height:18px}
.claude textarea{width:100%;min-height:58px;resize:vertical}
.tl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.tlbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tlwrap{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0}
.heads{display:flex;flex-direction:column}
.head{height:40px;display:flex;align-items:center;gap:4px;font:600 11px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line);padding-right:6px}
.head.ruler{height:24px}
.head button{min-height:24px;padding:0 6px;font-size:11px;border-radius:6px}
.scroll{overflow-x:auto;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.spacer{position:relative}
canvas#tl{display:block;position:sticky;left:0;touch-action:none}
.ph{position:absolute;top:0;left:0;width:2px;background:#ff5d6c;pointer-events:none;will-change:transform;z-index:2}
.ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:10px solid #ff5d6c}
.edit button{min-height:32px}
.goto{width:108px;font-family:var(--f-mono)}
.pill{max-width:min(360px,40vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 11px var(--f-mono);padding:2px 8px;border-radius:999px;background:#2c2550;color:#cbbcff}
.list{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto}
.item{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12.5px;background:var(--panel2);border-radius:8px;padding:6px 8px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:min(520px,92vw);width:100%}
dialog::backdrop{background:#0009}
.empty{color:var(--muted);font-size:13px}
</style>

<header>
  <h1><b>Claude</b> Studio</h1>
  <span class="proj" id="proj">Cargando proyecto…</span>
  <span class="save"><span class="dot" id="dot"></span><span id="savetxt">—</span></span>
  <span class="grow"></span>
  <button id="undo" title="Deshacer" disabled>↶ Deshacer</button>
  <button id="redo" title="Rehacer" disabled>↷ Rehacer</button>
  <button id="grande" title="Abrir el chat con Claude">💬 Claude</button>
  <button id="btnVers">Versiones</button>
  <button id="btnFin" class="pri">Finalizar proyecto</button>
</header>

<main>
    <div class="viewer" id="viewer">
      <div class="frame"><video id="vid" playsinline muted preload="auto"></video>
      <div class="sub" id="sub"></div></div>
      <div class="vbtns"><button id="fs" title="Pantalla completa (tecla F)">⛶ Pantalla completa</button></div>
      <div class="fsbar"><button id="fsplay" class="pri">▶ / ❚❚</button><button id="fsb">◀︎ 1 cuadro</button><button id="fsf">1 cuadro ▶︎</button><button id="fsx">Salir</button></div>
    </div>
  <div class="work">
    <div class="ctrls">
      <div class="card">
        <h2>Reproducción</h2>
        <div class="transport">
          <button id="play" class="pri" style="min-width:86px">▶ Play</button>
          <button id="fb" title="Un cuadro atrás">◀︎ 1 cuadro</button>
          <button id="ff" title="Un cuadro adelante">1 cuadro ▶︎</button>
          <span class="tc mono" id="tc">0:00.000</span>
        </div>
        <div class="row" style="margin-top:6px">
          <button id="b5">−5 s</button><button id="f5">+5 s</button>
          <span class="empty" id="loadtxt">Cargando audio…</span>
        </div>
      </div>
      <div class="card insp" id="insp">
        <h2>Propiedades</h2>
        <div class="empty">Toca una voz en la línea de tiempo para moverla, cambiarle el volumen o silenciarla.</div>
      </div>
    </div>

  <section class="tl">
    <div class="tlbar">
      <span class="pill" id="selpill">Nada seleccionado</span>
      <span class="row edit"><button id="bCut" title="Corta la voz en la barra roja (tecla S)">✂ Cortar</button><button id="bDup" title="Copia el pedazo seleccionado y lo pone en la barra roja (tecla D)">⧉ Duplicar</button><button id="bDel" title="Borra el pedazo seleccionado (tecla Supr)">🗑 Borrar</button></span>
      <input id="goto" class="goto" aria-label="Ir al tiempo exacto" placeholder="0:00.000" title="Escribe un tiempo (ej. 1:23.450) y Enter">
      <span class="grow"></span>
      <span class="empty">Zoom</span>
      <input id="zoom" type="range" min="20" max="2500" value="90" style="width:110px" aria-label="Zoom de la línea de tiempo">
      <button id="follow" class="on" title="La vista sigue a la barra roja">Seguir</button>
    </div>
    <div class="tlwrap">
      <div class="heads">
        <div class="head ruler">TIEMPO</div>
        <div class="head">TOMAS</div>
        <div class="head" style="height:96px">VOCES <span class="grow"></span><button id="mV">M</button><button id="lV" title="Bloquear">🔒</button></div>
        <div class="head">SUBTÍT.</div>
        <div class="head" style="height:56px">MÚSICA <span class="grow"></span><button id="mC">M</button></div>
      </div>
      <div class="scroll" id="scroll"><div class="spacer" id="spacer"><canvas id="tl"></canvas><div class="ph" id="ph"></div></div></div>
    </div>
  </section>
</div>
</main>
  <div class="card claude">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Claude</h2><button id="cclose">Cerrar</button></div>
    <div class="log" id="log"></div>
    <div class="status" id="cstat"></div>
    <textarea id="ask" placeholder="Ej.: adelanta la voz V12 80 ms · baja el volumen de Tocino · ¿qué voces están desfasadas?"></textarea>
    <div class="row" style="margin-top:6px">
      <button id="send" class="pri">Enviar a Claude</button>
      <button id="stop" hidden>Detener</button>
      <span class="grow"></span>
      <button id="toCC" title="Tareas grandes: render, separar audio, corregir imagen">Encargar a Claude Code</button>
    </div>
  </div>



<dialog id="dlg"><div id="dlgbody"></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button id="dlgclose">Cerrar</button></div></dialog>

<script>
(function(){
const PID = 'cap01p1';
const $ = id => document.getElementById(id);
const vid = $('vid'), cv = $('tl'), sc = $('scroll'), spacer = $('spacer'), ph = $('ph');
const TRACK = {ruler:24, toma:40, voz:96, sub:40, cama:56};
const H = TRACK.ruler + TRACK.toma + TRACK.voz + TRACK.sub + TRACK.cama;
const YV = TRACK.ruler + TRACK.toma;
let db = null, sample = null;
let P = null, V = {}, versiones = [], mensajes = [];
let pps = 90, sel = null, muteV = false, muteC = false, lockV = false, follow = true;
let undo = [], redo = [];
const bufU = {};            // url -> AudioBuffer
let ac = null, master = null, playing = false, t0ac = 0, t0v = 0, srcs = [], tP = 0;
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); };
const ms = x => (x >= 0 ? '+' : '−') + Math.round(Math.abs(x) * 1000) + ' ms';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// un pedazo de voz: suena desde «desde» hasta «hasta» (segundos dentro del archivo), corrido «mueve»
const D = v => v.desde || 0, HA = v => v.hasta ?? v.dur, pos = v => v.inicio + (v.mueve || 0) + D(v), len = v => HA(v) - D(v);
const BUFAUD = v => bufU[v.wav || v.url];

/* ---------- guardado (no destructivo: nunca se toca el audio original) ---------- */
let pend = 0; const patchQ = {}, timers = {}, localUntil = {};
function setSave(state, txt){ $('dot').className = 'dot' + (state === 'busy' ? ' busy' : state === 'err' ? ' err' : ''); $('savetxt').textContent = txt; }
async function escribir(fn){ if (!db) return; pend++; setSave('busy', 'Guardando…');
  try { await fn(); pend--; if (!pend) setSave('ok', 'Guardado'); } catch (e) { pend--; setSave('err', 'No se pudo guardar: ' + (e.code || e.message)); } }
function guardar(id, patch, autor){ patchQ[id] = Object.assign(patchQ[id] || {}, patch); localUntil[id] = Date.now() + 3000;
  clearTimeout(timers[id]); timers[id] = setTimeout(() => { const p = patchQ[id]; delete patchQ[id]; delete timers[id];
    escribir(() => db.doc(`proyectos/${PID}/voces/${id}`).update(Object.assign({}, p, {editado_por: autor || 'jay', editado: new Date().toISOString()}))); }, 400); }
function crearDoc(doc){ localUntil[doc.id] = Date.now() + 4000; V[doc.id] = doc; escribir(() => db.doc(`proyectos/${PID}/voces/${doc.id}`).set(doc)); }
function borrarDoc(id){ localUntil[id] = Date.now() + 4000; delete V[id]; clearTimeout(timers[id]); delete timers[id]; delete patchQ[id]; escribir(() => db.doc(`proyectos/${PID}/voces/${id}`).delete()); }
function aplicar(id, patch, autor){ if (!V[id]) return; Object.assign(V[id], patch); guardar(id, patch, autor); }
function paso(u){ undo.push(u); redo = []; syncUndo(); }
function cambio(id, patch, autor){ const v = V[id]; if (!v) return; const prev = {}; for (const k in patch) prev[k] = v[k] ?? null;
  aplicar(id, patch, autor); paso({undo: () => aplicar(id, prev), redo: () => aplicar(id, patch)}); tocado(); }
function tocado(){ pedirDibujo(); insp(); if (playing) reprogramar(); }
function syncUndo(){ $('undo').disabled = !undo.length; $('redo').disabled = !redo.length; }
$('undo').onclick = () => { const u = undo.pop(); if (!u) return; u.undo(); redo.push(u); syncUndo(); tocado(); };
$('redo').onclick = () => { const u = redo.pop(); if (!u) return; u.redo(); undo.push(u); syncUndo(); tocado(); };

/* ---------- cortar, duplicar, borrar ---------- */
function nuevoId(base){ let n = 2; while (V[base + '-' + n]) n++; return base + '-' + n; }
function bajoCursor(){ const t = tNow(); if (sel && V[sel] && t > pos(V[sel]) && t < pos(V[sel]) + len(V[sel])) return sel;
  return Object.keys(V).find(id => { const v = V[id]; return t > pos(v) && t < pos(v) + len(v); }); }
function cortar(){ const id = bajoCursor(); if (!id) { aviso('Pon la barra roja encima de una voz para cortarla.'); return; }
  const v = V[id], local = tNow() - (v.inicio + (v.mueve || 0));
  if (local <= D(v) + 0.03 || local >= HA(v) - 0.03) { aviso('Muy cerca del borde para cortar.'); return; }
  const prevH = HA(v), nid = nuevoId(v.base || id), b = Object.assign({}, v, {id: nid, base: v.base || id, desde: +local.toFixed(3), hasta: prevH});
  const doit = () => { aplicar(id, {hasta: +local.toFixed(3)}); crearDoc(Object.assign({}, b)); };
  doit(); sel = nid; paso({undo: () => { borrarDoc(nid); aplicar(id, {hasta: prevH}); sel = id; }, redo: () => { doit(); sel = nid; }}); tocado(); aviso('Cortada en ' + fmt(tNow()) + '. Ahora son dos pedazos: ' + id + ' y ' + nid + '.'); }
function duplicar(){ if (!sel || !V[sel]) { aviso('Toca primero un pedazo de voz.'); return; }
  const v = V[sel], nid = nuevoId(v.base || sel), mueve = +(tNow() - v.inicio - D(v)).toFixed(3);
  const b = Object.assign({}, v, {id: nid, base: v.base || sel, mueve, mute: false});
  crearDoc(Object.assign({}, b)); sel = nid; paso({undo: () => { borrarDoc(nid); }, redo: () => crearDoc(Object.assign({}, b))}); tocado(); aviso('Copia puesta en ' + fmt(tNow()) + '.'); }
function borrar(){ if (!sel || !V[sel]) { aviso('Toca primero un pedazo de voz.'); return; }
  const id = sel, copia = Object.assign({}, V[id]); borrarDoc(id); sel = null;
  paso({undo: () => crearDoc(Object.assign({}, copia)), redo: () => borrarDoc(id)}); tocado(); limpiarInsp(); aviso(id + ' borrada. Con Deshacer vuelve.'); }
$('bCut').onclick = cortar; $('bDup').onclick = duplicar; $('bDel').onclick = borrar;
let avisoT = null; function aviso(t){ $('selpill').textContent = t; clearTimeout(avisoT); avisoT = setTimeout(pillSel, 3500); }
function pillSel(){ $('selpill').textContent = sel && V[sel] ? sel + ' seleccionada' : 'Nada seleccionado'; }

/* ---------- audio y reproducción fluida ---------- */
async function cargarAudio(){
  try { ac = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'playback'}); master = ac.createGain(); master.connect(ac.destination); } catch (e) { $('loadtxt').textContent = 'Este navegador no reproduce el audio.'; return; }
  const urls = [...new Set([P.cama_wav || P.cama, ...Object.values(V).map(v => v.wav || v.url)].filter(Boolean))]; let n = 0;
  const get = async u => { try { bufU[u] = await ac.decodeAudioData(await (await fetch(u)).arrayBuffer()); } catch (e) {} $('loadtxt').textContent = `Audio ${++n}/${urls.length}`; pedirDibujo(); };
  for (let i = 0; i < urls.length; i += 6) await Promise.all(urls.slice(i, i + 6).map(get));
  $('loadtxt').textContent = 'Listo';
}
function tNow(){ return playing ? t0v + (ac.currentTime - t0ac) : tP; }
function stopAll(){ srcs.forEach(s => { try { s.stop(); s.disconnect(); } catch (e) {} }); srcs = []; }
function programar(t, when){
  stopAll(); t0ac = when; t0v = t;
  const play = (b, at, off0, dur, gain) => { if (!b || dur <= 0) return; const k = Math.max(0, t - at); if (k >= dur) return;
    const s = ac.createBufferSource(); s.buffer = b; let node = s; if (gain !== 1) { const g = ac.createGain(); g.gain.value = gain; s.connect(g); node = g; } node.connect(master);
    s.start(when + Math.max(0, at - t), off0 + k, dur - k); srcs.push(s); };
  if (!muteC) { const b = bufU[P.cama_wav || P.cama]; if (b) play(b, 0, 0, b.duration, 1); }
  if (!muteV) for (const id in V) { const v = V[id]; if (!v.mute) play(BUFAUD(v), pos(v), D(v), len(v), v.gain ?? 1); }
}
function reprogramar(){ if (playing) programar(tNow() + 0.03, ac.currentTime + 0.03); }
async function arrancar(){
  const t = tP; vid.playbackRate = 1;
  if (Math.abs(vid.currentTime - t) > 0.02) { vid.currentTime = t; await new Promise(r => { const f = () => { vid.removeEventListener('seeked', f); r(); }; vid.addEventListener('seeked', f); setTimeout(f, 600); }); }
  if (!playing) return;
  const p = vid.play(); if (p) await p.catch(() => {});
  programar(vid.currentTime, ac.currentTime + 0.01);
}
async function togglePlay(){
  if (!ac) return; if (ac.state === 'suspended') await ac.resume();
  if (playing) { tP = tNow(); playing = false; stopAll(); vid.pause(); vid.playbackRate = 1; irVideo(tP); $('play').textContent = '▶ Play'; }
  else { if (P && tP >= P.duracion - 0.05) tP = 0; playing = true; $('play').textContent = '❚❚ Pausa'; arrancar(); }
}
// búsqueda sin trabarse: si el video aún está buscando, se guarda el último pedido
let pendSeek = null;
function irVideo(t){ if (vid.seeking) { pendSeek = t; return; } vid.currentTime = t; }
vid.addEventListener('seeked', () => { if (pendSeek != null && !playing) { const t = pendSeek; pendSeek = null; vid.currentTime = t; } else pendSeek = null; });
function seek(t){ t = Math.max(0, Math.min(P ? P.duracion : 0, t)); tP = t;
  if (playing) { playing = false; stopAll(); vid.pause(); playing = true; arrancar(); } else irVideo(t); }
$('play').onclick = togglePlay;
const viewer = $('viewer');
function fsToggle(){ if (document.fullscreenElement) document.exitFullscreen(); else if (viewer.requestFullscreen) viewer.requestFullscreen().catch(() => {}); }
$('fs').onclick = fsToggle; $('fsx').onclick = fsToggle; $('fsplay').onclick = togglePlay;

let lastTc = '';
function loop(){
  if (playing) { const t = tNow();
    // el audio manda el reloj; el video se ajusta suave con la velocidad, sin saltos
    if (!vid.paused && !vid.seeking) { const drift = vid.currentTime - t;
      if (Math.abs(drift) > 0.35) vid.currentTime = t; else vid.playbackRate = Math.abs(drift) < 0.015 ? 1 : Math.max(0.9, Math.min(1.1, 1 - drift * 2)); }
    if (P && t >= P.duracion) togglePlay();
    if (follow) { const xc = t * pps, L = sc.scrollLeft, R = L + sc.clientWidth; if (xc > R - 80 || xc < L) sc.scrollLeft = xc - sc.clientWidth * 0.25; } }
  const t = tNow(), tc = fmt(t); if (tc !== lastTc) { lastTc = tc; $('tc').textContent = tc; }
  ph.style.transform = `translateX(${(t * pps - 1).toFixed(1)}px)`;
  subtitulo(t); if (dirty) dibujar(); requestAnimationFrame(loop);
}

const ctx = cv.getContext('2d');

function onda(u, t0, a, b, y, h, color, ox, W){ // dibuja el archivo u entre a y b segundos, puesto en t0 (tiempo del proyecto de «a»)
  const p = pk(u); if (!p) return; ctx.fillStyle = color; const x0 = Math.max(0, t0 * pps - ox), x1 = Math.min(W, (t0 + b - a) * pps - ox);

    for (let i = Math.floor(s0 * PR), i1 = Math.max(i + 1, Math.ceil(s1 * PR)); i < i1; i++) if (p[i] > m) m = p[i];
    const hh = Math.max(1, Math.min(1, m * 2.4) * h / 2); ctx.fillRect(x, y + h / 2 - hh, 1, hh * 2); } }
let dirty = true; function pedirDibujo(){ dirty = true; }
let CW = 0;

  const dpr = window.devicePixelRatio || 1; CW = sc.clientWidth; cv.width = CW * dpr; cv.height = H * dpr; cv.style.width = CW + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); dirty = true; }

  const steps = [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1, 5, 10]; const step = steps.find(s => s * pps >= 70) || 10, sub = step / 5;
  const tA = ox / pps, tB = (ox + W) / pps; ctx.fillStyle = '#5c6070';

  let y = TRACK.ruler;
  (P.tomas || []).forEach((k, i) => { const x = X(k.inicio), w = k.dur * pps; if (x > W || x + w < 0) return; ctx.fillStyle = i % 2 ? '#323745' : '#2a2e3a'; ctx.fillRect(x, y + 4, w - 1, TRACK.toma - 8);
    ctx.fillStyle = '#c9cdd8'; if (w > 26) ctx.fillText(k.toma, Math.max(x, 0) + 4, y + TRACK.toma / 2); });
  y += TRACK.toma;
  for (const id in V) { const v = V[id], x = X(pos(v)), w = len(v) * pps, isS = sel === id; if (x > W || x + w < 0) continue;
    ctx.fillStyle = v.mute ? '#24252c' : isS ? '#4a3a9a' : '#33295e'; ctx.fillRect(x, y + 3, w, TRACK.voz - 6);

    ctx.strokeStyle = isS ? '#e3dbff' : (Math.abs(v.mueve || 0) > 0.0005 ? '#3d8bff' : '#4b3f8c'); ctx.lineWidth = isS ? 2 : 1; ctx.strokeRect(x + .5, y + 3.5, w - 1, TRACK.voz - 7);
    if (isS) { ctx.fillStyle = '#e3dbff'; ctx.fillRect(x, y + TRACK.voz / 2 - 14, 5, 28); ctx.fillRect(x + w - 5, y + TRACK.voz / 2 - 14, 5, 28); }

// ratón / dedo: barra roja, mover voz, recortar bordes
let drag = null;
function hitVoz(t, xPx){ // primero los bordes del pedazo seleccionado, luego cualquier borde cercano, luego el cuerpo
  const orden = Object.keys(V).sort((p, q) => (q === sel) - (p === sel));
  for (const id of orden) { const v = V[id], ax = pos(v) * pps, bx = (pos(v) + len(v)) * pps;
    if (Math.abs(xPx - ax) <= 9) return {id, modo: 'izq'}; if (Math.abs(xPx - bx) <= 9) return {id, modo: 'der'}; }
  for (const id of orden) { const v = V[id]; if (t >= pos(v) && t <= pos(v) + len(v)) return {id, modo: 'mover'}; }
  return null; }

  const {x, y, t} = ptr(e); cv.setPointerCapture(e.pointerId);
  if (y >= YV && y < YV + TRACK.voz) { const h = hitVoz(t, x);
    if (h) { sel = h.id; pillSel(); insp(); pedirDibujo(); if (!lockV) { const v = V[h.id]; drag = {modo: h.modo, id: h.id, x0: e.clientX, m0: v.mueve || 0, d0: D(v), h0: HA(v), moved: false}; } else drag = null; return; } }
  drag = {modo: 'barra'}; seek(t);
});
cv.addEventListener('pointermove', e => {
  const {x, y, t} = ptr(e);
  if (!drag) { let c = 'col-resize'; if (y >= YV && y < YV + TRACK.voz) { const h = hitVoz(t, x); if (h) c = h.modo === 'mover' ? (lockV ? 'not-allowed' : 'grab') : 'ew-resize'; } cv.style.cursor = c; return; }
  if (drag.modo === 'barra') { // arrastrar la barra roja hasta el milisegundo; borde: avanza la vista sola
    const r = sc.getBoundingClientRect(); if (e.clientX > r.right - 30) sc.scrollLeft += 12; if (e.clientX < r.left + 30) sc.scrollLeft -= 12; seek(ptr(e).t); return; }

    const prev = drag.modo === 'mover' ? {mueve: drag.m0} : drag.modo === 'izq' ? {desde: drag.d0} : {hasta: drag.h0};
    const next = {}; for (const k in prev) next[k] = v[k]; Object.assign(v, prev); cambio(id, next); }
  drag = null; }
cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);

  {name: 'silenciar_voz', description: 'Silencia o activa una voz.', inputSchema: {type: 'object', properties: {id: {type: 'string'}, silenciar: {type: 'boolean'}}, required: ['id', 'silenciar']},
   execute: ({id, silenciar}) => { id = idv(id); if (!V[id]) throw new Error('No existe ' + id); cambio(id, {mute: !!silenciar}, 'claude'); return {ok: true}; }},
  {name: 'ir_a', description: 'Mueve la barra roja a un segundo del video.', inputSchema: {type: 'object', properties: {segundo: {type: 'number'}}, required: ['segundo']},
   execute: ({segundo}) => { seek(+segundo); centrar(); return {ok: true}; }},
  {name: 'cortar_en_barra', description: 'Corta en dos la voz que está bajo la barra roja (usa ir_a antes).', inputSchema: {type: 'object', properties: {}},
   execute: () => { cortar(); return {ok: true, seleccionada: sel}; }},
];
$('send').onclick = async () => {
  const q = $('ask').value.trim(); if (!q) return;
  if (!sample) { $('cstat').textContent = 'Claude no está disponible en esta vista. Usa «Encargar a Claude Code».'; return; }
  $('ask').value = ''; hist.push({role: 'user', content: q, fecha: new Date().toISOString()}); pintaLog();
  const prompt = `Eres el asistente de edición de Claude Studio. Proyecto: ${P.nombre}, dura ${P.duracion.toFixed(1)} s. La barra roja está en ${tNow().toFixed(3)} s.${sel ? ' Voz seleccionada: ' + sel + '.' : ''}
Voces (una por línea):\n${resumen()}
Reglas: haz solo lo que pide el usuario, con las herramientas. No cambies nada creativo que no pidió. Responde en español, corto y claro, diciendo qué cambiaste.
Conversación previa:\n${hist.slice(-8, -1).map(h => (h.role === 'user' ? 'Usuario: ' : 'Claude: ') + h.content).join('\n')}
Usuario: ${q}`;
  ctrl = new AbortController(); $('stop').hidden = false; $('send').disabled = true; $('cstat').textContent = 'Pensando…';
  const h = {role: 'assistant', content: '', fecha: new Date().toISOString()}; hist.push(h);
  try { const r = await sample(prompt, {tools: TOOLS, signal: ctrl.signal, cache: false, onText: ({text}) => { h.content = text; $('cstat').textContent = 'Escribiendo…'; pintaLog(); }});
    h.content = r.text; $('cstat').textContent = 'Listo'; }
  catch (e) { h.content = e.text || (e.code === 'not_granted' ? 'Sin permiso para usar Claude en esta página.' : e.code === 'cancelled' ? 'Detenido.' : 'No se pudo: ' + (e.message || e.code)); $('cstat').textContent = ''; }
  $('stop').hidden = true; $('send').disabled = false; pintaLog();
};
$('stop').onclick = () => ctrl && ctrl.abort();
$('toCC').onclick = async () => { const q = $('ask').value.trim(); if (!q) { $('cstat').textContent = 'Escribe primero la tarea para Claude Code.'; return; }
  try { await db.collection(`proyectos/${PID}/mensajes`).add({de: 'jay', para: 'claude-code', tipo: 'tarea', texto: q, estado: 'pendiente', fecha: new Date().toISOString(), cursor: +tNow().toFixed(3), voz: sel || null});
    $('ask').value = ''; $('cstat').textContent = 'Tarea guardada. Avísale a Claude Code en el chat.'; } catch (e) { $('cstat').textContent = 'No se pudo guardar la tarea.'; } };

/* ---------- arranque ---------- */
async function start(){
  const to = setTimeout(() => { if (!P) $('proj').textContent = 'No se pudo cargar el proyecto. Recarga la página.'; }, 10000);
  db = await claude.use('db');
  claude.use('sample').then(s => { sample = s; if (!s) $('send').disabled = true; });
  if (!db) { clearTimeout(to); $('proj').textContent = 'Inicia sesión para abrir el proyecto.'; return; }
  db.doc('proyectos/' + PID).onSnapshot(s => { clearTimeout(to); if (!s.exists) { $('proj').textContent = 'El proyecto todavía no tiene datos.'; return; }
    const first = !P; P = s.data(); $('proj').textContent = P.nombre + ' · ' + fmt(P.duracion);
    if (first) { vid.preload = 'auto'; vid.src = P.video; size(); setSave('ok', 'Guardado'); } pedirDibujo(); }, () => setSave('err', 'Sin conexión'));
  db.collection(`proyectos/${PID}/voces`).onSnapshot(q => { const now = Date.now(), ids = new Set();
    q.docs.forEach(d => { ids.add(d.id); if ((localUntil[d.id] || 0) > now) return; V[d.id] = Object.assign(V[d.id] || {}, d.data()); });
    for (const id of Object.keys(V)) if (!ids.has(id) && (localUntil[id] || 0) <= now) { delete V[id]; if (sel === id) { sel = null; limpiarInsp(); } }
    pedirDibujo(); insp(); });
  db.collection(`proyectos/${PID}/versiones`).orderBy('fecha', 'desc').limit(30).onSnapshot(q => { versiones = q.docs.map(d => Object.assign({_id: d.id}, d.data())); });
  db.collection(`proyectos/${PID}/mensajes`).orderBy('fecha').limit(60).onSnapshot(q => { mensajes = q.docs.map(d => d.data()); pintaLog(); });
  pintaLog(); limpiarInsp(); requestAnimationFrame(loop);
  const wait = setInterval(() => { if (P && Object.keys(V).length && !ac) { clearInterval(wait); cargarAudio(); } }, 400);
}
if (window.claude && claude.use) start(); else $('proj').textContent = 'Abre esta página dentro de Claude.';
})();
